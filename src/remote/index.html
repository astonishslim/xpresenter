<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'; style-src 'self'; script-src 'self'" />
  <title>xpresenter Remoto</title>
  <link rel="stylesheet" href="remote.css" />
</head>
<body>
  <header>
    <strong>xpresenter</strong>
    <a id="stage-link" href="#" data-icon="monitor-speaker" data-icon-size="16"><span class="label">Retorno</span></a>
    <span id="conn" class="dot" role="status" aria-label="Conexão"></span>
  </header>
  <div id="live"><small id="live-label"></small><div id="live-text">—</div></div>
  <div class="bar">
    <button id="prev" type="button" data-icon="skip-back" data-icon-size="22" aria-label="Slide anterior"><span class="label">Anterior</span></button>
    <button id="next" class="primary" type="button" data-icon="skip-forward" data-icon-size="22" aria-label="Próximo slide"><span class="label">Próximo</span></button>
  </div>
  <div class="bar">
    <button id="clear" type="button" data-icon="eraser" data-icon-size="22" aria-label="Limpar conteúdo"><span class="label">Limpar</span></button>
    <button id="black" type="button" data-icon="eye-off" data-icon-size="22" aria-label="Tela preta"><span class="label">Preto</span></button>
    <button id="cover" type="button" data-icon="layers" data-icon-size="22" aria-label="Capa"><span class="label">Capa</span></button>
    <button id="lyrics" type="button" data-icon="captions-off" data-icon-size="22" aria-label="Ocultar ou mostrar a letra"><span class="label">Letra</span></button>
  </div>
  <div id="media-bar" class="bar" hidden>
    <button id="media-toggle" type="button" data-icon="pause" data-icon-size="22" aria-label="Pausar ou tocar o vídeo"><span class="label">Pausar vídeo</span></button>
    <button id="media-restart" type="button" data-icon="rotate-ccw" data-icon-size="22" aria-label="Voltar o vídeo ao início"><span class="label">Do início</span></button>
  </div>
  <div class="bar timer-bar">
    <span id="timer-text" class="timer-text" role="timer">00:00</span>
    <button id="timer-toggle" type="button" data-icon="play" data-icon-size="22" aria-label="Iniciar ou pausar o cronômetro"><span class="label">Iniciar</span></button>
    <button id="timer-reset" type="button" data-icon="timer-reset" data-icon-size="22" aria-label="Zerar o cronômetro"><span class="label">Zerar</span></button>
  </div>
  <div id="playlist"></div>
  <script src="icons.js"></script>
  <script src="liveInfo.js"></script>
  <script src="remote.js"></script>
</body>
</html>
